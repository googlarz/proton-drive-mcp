name: proton-drive-mcp
displayName: Proton Drive MCP
description: >
  Claude Desktop MCP and companion CLI for Proton Drive.
  List, upload, download, share, and manage end-to-end encrypted files
  without credential exposure — auth handled by the official Proton Drive CLI.
license: MIT
homepage: https://github.com/googlarz/proton-drive-mcp
repository: https://github.com/googlarz/proton-drive-mcp
categories:
  - storage
  - productivity
  - privacy
tools:
  - drive_auth_status
  - drive_auth_logout
  - drive_version
  - drive_list
  - drive_mkdir
  - drive_upload
  - drive_download
  - drive_move
  - drive_delete
  - drive_list_trash
  - drive_share_status
  - drive_share_invite
  - drive_share_revoke
  - drive_trash
  - drive_restore
  - drive_empty_trash
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |-
    (_config) => ({ command: "npx", args: ["-y", "proton-drive-mcp"] })
