name: proton-drive-mcp
displayName: Proton Drive MCP
description: >
  MCP server and CLI that gives Claude full access to Proton Drive —
  upload, download, share, and manage your end-to-end encrypted files
  without leaving the conversation.
license: MIT
homepage: https://github.com/googlarz/proton-drive-mcp
repository: https://github.com/googlarz/proton-drive-mcp
categories:
  - storage
  - productivity
  - privacy
tools:
  - drive_auth_status
  - drive_auth_logout
  - drive_version
  - drive_list
  - drive_mkdir
  - drive_upload
  - drive_download
  - drive_move
  - drive_delete
  - drive_list_trash
  - drive_share_status
  - drive_share_invite
  - drive_share_revoke
  - drive_trash
  - drive_restore
  - drive_empty_trash
  - drive_read_file
  - drive_write_file
  - drive_copy
  - drive_list_invitations
  - drive_invitation_accept
  - drive_invitation_reject
  - drive_share_leave
  - photos_list_albums
  - photos_create_album
  - photos_delete_album
  - photos_list_album_photos
  - photos_add_to_album
  - photos_remove_from_album
  - drive_share_set_url
  - drive_share_remove_url
  - drive_share_remove_all
  - photos_update_album
  - photos_list_timeline
  - photos_download
  - photos_upload
  - drive_info
  - drive_rename
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      PROTON_DRIVE_SYNC_PATH:
        type: string
        description: "Absolute path to the root of your local Proton Drive sync folder. Required only for drive_read_file and drive_write_file. Example: /Users/you/Proton Drive"
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "proton-drive-mcp"],
      env: config.PROTON_DRIVE_SYNC_PATH ? { PROTON_DRIVE_SYNC_PATH: config.PROTON_DRIVE_SYNC_PATH } : {}
    })
